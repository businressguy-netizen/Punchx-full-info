name: PunchX CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression tests (5 parallel passes)
        shell: bash
        run: |
          pids=()
          for pass in 1 2 3 4 5; do
            npm test > "/tmp/punchx-test-$pass.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          for pass in 1 2 3 4 5; do
            echo "===== Verification pass $pass/5 ====="
            cat "/tmp/punchx-test-$pass.log"
          done
          exit "$status"

      - name: Typecheck
        run: npm run lint:typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_NAMOID_CLIENT_ID: ${{ vars.VITE_NAMOID_CLIENT_ID }}
          VITE_NAMOID_REDIRECT_URI: https://www.punchxapp.co.in/auth/callback
