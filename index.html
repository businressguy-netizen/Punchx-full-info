    <script>
      (function(l) {
        if (l.hostname === 'punchxapp.co.in') { window.location.replace('https://www.punchxapp.co.in' + l.pathname + l.search + l.hash); return; }
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
      (function() {
        function isViteWsError(err) { if (!err) return false; var msg=(err.message||err.reason||err.stack||String(err)).toLowerCase(); return msg.includes('websocket')||msg.includes('vite')||msg.includes('ws'); }
        window.addEventListener('unhandledrejection', function(event) { if (isViteWsError(event.reason)) event.preventDefault(); }, true);
        window.addEventListener('error', function(event) { if (isViteWsError(event.error)||isViteWsError(event.message)) event.preventDefault(); }, true);
      })();
    </script>
