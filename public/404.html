<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — PunchX</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you are looking for could not be found. Return to PunchX to explore local service professionals for everyday needs.">
    <link rel="canonical" href="https://www.punchxapp.co.in/">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <script type="text/javascript">
      // SPA Single Page App redirect for GitHub Pages custom domains
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#111216;color:#fff;font-family:system-ui,sans-serif;">
    <main style="text-align:center;padding:32px;">
      <img src="/favicon.jpg" alt="PUNCHX" width="112" height="112" style="display:block;object-fit:contain;background:#fff;border-radius:18px;padding:8px;margin:0 auto 18px;" />
      <h1 style="margin:0 0 8px;color:#f0d79b;">PUNCHX</h1>
      <p style="margin:0;color:#e5e7eb;">Taking you back to the PUNCHX home page…</p>
    </main>
  </body>
</html>
