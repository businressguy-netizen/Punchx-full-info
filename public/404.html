<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — PunchX</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you are looking for could not be found. Return to PunchX to book trusted home services.">
    <link rel="canonical" href="https://www.punchxapp.co.in/">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <script type="text/javascript">
      // SPA Single Page App redirect for GitHub Pages custom domains
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
